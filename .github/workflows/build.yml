name: Build
on: workflow_call
permissions: {}
jobs:
  build:
    strategy:
      matrix:
        artifact:
        - name: datapack
          make-target: build-datapack
          path-prefix: elytra-chestplates
        - name: resourcepack
          make-target: build-resourcepack
          path-prefix: ElytraChestplates
    runs-on: ubuntu-24.04-arm
    name: ${{ matrix.artifact.name }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-nix
    - name: Build ${{ matrix.artifact.name }}
      run: nix develop .#build -c make ${{ matrix.artifact.make-target }}
    - name: Upload ${{ matrix.artifact.name }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.artifact.name }}
        path: ${{ matrix.artifact.path-prefix }}.zip
        include-hidden-files: true
        if-no-files-found: error
  checksums:
    runs-on: ubuntu-24.04-arm
    needs: build
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-nix
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        merge-multiple: true
        path: artifacts
    - name: Generate artifact checksums
      working-directory: artifacts
      run: nix develop .#createChecksums -c sha256sum * >> ../checksums.txt
    - name: Upload checksums
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: checksums
        path: checksums.txt
        include-hidden-files: true
        if-no-files-found: error
